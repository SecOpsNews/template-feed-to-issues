---
name: Close old items

on:
    schedule:
        - cron: "11 * * * *"
    workflow_dispatch:

permissions:
    issues: write

jobs:
    stale:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/stale@v11
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  stale-issue-message: "No activity for 2 days. Closing in 1 day unless someone comments."
                  close-issue-message: "Closed after 3 days with no activity."
                  days-before-stale: 2
                  days-before-close: 1
                  days-before-pr-stale: -1
                  days-before-pr-close: -1
                  exempt-issue-labels: "keep"
                  operations-per-run: 500
